[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spyder-serial-bridge"
version = "0.1.0"
description = "RS232-to-IP bridge for Christie Spyder S control systems"
readme = "README.md"
license = { text = "MIT" }
# Raspberry Pi OS Bookworm ships 3.11.
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
